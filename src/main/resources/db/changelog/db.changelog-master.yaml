# Entry point for Liquibase. Add new change files at the end, in order.
# Never edit a changeset that has already run: add a new one instead.
databaseChangeLog:
  - include:
      file: changes/001-create-lego-themes.yaml
      relativeToChangelogFile: true
  - include:
      file: changes/002-create-lego-sets.yaml
      relativeToChangelogFile: true
