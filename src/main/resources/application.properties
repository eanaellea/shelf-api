spring.application.name=shelf-api

# Flyway owns the schema; Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Keep the dev database between restarts instead of stopping it on shutdown.
spring.docker.compose.lifecycle-management=start-only

# Errors are returned as RFC 9457 problem details (application/problem+json).
spring.mvc.problemdetails.enabled=true
