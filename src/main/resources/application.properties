spring.application.name=shelf-api

# Read local secrets from the same .env file Docker Compose uses.
spring.config.import=optional:file:.env[.properties]

# Flyway owns the schema; Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Keep the dev database between restarts instead of stopping it on shutdown.
spring.docker.compose.lifecycle-management=start-only

# Errors are returned as RFC 9457 problem details (application/problem+json).
spring.mvc.problemdetails.enabled=true

# Comma-separated list of front-end origins allowed to call the API from a browser.
shelf.cors.allowed-origins=${SHELF_CORS_ALLOWED_ORIGINS:http://localhost:5173}

spring.http.serviceclient.rebrickable.base-url=https://rebrickable.com/api/v3
spring.http.serviceclient.rebrickable.default-header.Authorization=key ${REBRICKABLE_API_KEY}
