spring.application.name=shelf-api

# Read local secrets from the same .env file Docker Compose uses.
spring.config.import=optional:file:.env[.properties]

# Flyway owns the schema; Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Keep the dev database between restarts instead of stopping it on shutdown.
spring.docker.compose.lifecycle-management=start-only

# Errors are returned as RFC 9457 problem details (application/problem+json).
spring.mvc.problemdetails.enabled=true

# Comma-separated list of front-end origins allowed to call the API from a browser.
shelf.cors.allowed-origins=${SHELF_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Firebase Authentication: requests carry a Firebase ID token (a JWT signed by Google).
shelf.firebase.project-id=${FIREBASE_PROJECT_ID:shelf-24dc6}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://www.googleapis.com/service_accounts/v1/jwk/securetoken@system.gserviceaccount.com
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://securetoken.google.com/${shelf.firebase.project-id}
spring.security.oauth2.resourceserver.jwt.audiences=${shelf.firebase.project-id}

# Firebase UID of the shelf owner, the only user allowed to change the shelf.
shelf.owner-uid=${SHELF_OWNER_UID}

spring.http.serviceclient.rebrickable.base-url=https://rebrickable.com/api/v3
spring.http.serviceclient.rebrickable.default-header.Authorization=key ${REBRICKABLE_API_KEY}
