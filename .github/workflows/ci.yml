# Builds the project and runs the tests on every pull request, and on main after a merge.
# The tests start their own Postgres with Testcontainers, using the Docker that GitHub's runners have.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      # Caches Gradle's downloads between runs.
      - uses: gradle/actions/setup-gradle@v5

      - run: ./gradlew build
