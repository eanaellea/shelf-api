# Claude reviews each pull request when it's opened or updated, and leaves comments on it.
# Needs the Claude GitHub app installed on the repo and an ANTHROPIC_API_KEY repository secret.
name: Claude review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. This is a Kotlin Spring Boot API with a Postgres database
            managed by Liquibase. Focus on:
            - bugs and edge cases
            - security, especially which user can see or change which data
            - Liquibase changesets: an existing changeset must never be edited
            - missing tests for new behavior

            The code is meant to stay simple, don't suggest unnecessary extras or optimizations.

            Use inline comments for specific lines, and one short summary comment on the PR
            with `gh pr comment`. Only comment on real problems; skip praise.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
